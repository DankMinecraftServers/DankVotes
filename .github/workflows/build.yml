name: Build

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ '**.md', 'LICENSE', '.github/ISSUE_TEMPLATE/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check the Velocity version matches pom.xml
        run: |
          POM=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)
          VEL=$(grep -oP 'version = "\K[^"]+' velocity/src/main/java/com/dankmc/dankvotes/velocity/DankVotesVelocity.java)
          echo "pom=$POM velocity=$VEL"
          if [ "$POM" != "$VEL" ]; then
            echo "::error::@Plugin(version) in DankVotesVelocity.java is $VEL but pom.xml says $POM"
            exit 1
          fi

      - name: Build with Maven
        run: mvn -B -ntp clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: DankVotes
          path: dist/target/DankVotes-*.jar
          if-no-files-found: error
