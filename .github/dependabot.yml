version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: maven
    directory: /
    schedule: { interval: monthly }
    ignore:
      # These are pinned on purpose: 1.8.8 API = widest compatibility.
      - dependency-name: org.spigotmc:spigot-api
