version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: maven
    directory: /
    schedule: { interval: monthly }
    ignore:
      # These are pinned on purpose: the oldest API each platform supports = widest compatibility.
      - dependency-name: org.spigotmc:spigot-api
      - dependency-name: org.spongepowered:spongeapi
      - dependency-name: net.md-5:bungeecord-api
