name: DankVotes
version: '${project.version}'
main: com.dankmc.dankvotes.paper.DankVotesPaper
author: DankMinecraftServers
description: Vote rewards done right - polling (no port forwarding), Votifier v1/v2, NuVotifier hook, streaks, vote parties, reminders, leaderboards.
website: https://dankminecraftservers.com

# NOTE: api-version is intentionally OMITTED.
# Declaring api-version (added in 1.13) makes servers older than 1.13 refuse to load
# the plugin. Omitting it keeps us loadable on 1.8-1.12 too. Modern servers treat a
# missing api-version as "legacy" which is harmless for a command/event plugin like this.
#
# folia-supported: true is REQUIRED for Folia to load the plugin at all. On servers
# older than Folia this key is simply unknown and ignored - so it's safe everywhere.
folia-supported: true

# Load after these if present so our hooks can find them.
softdepend: [Votifier, PlaceholderAPI]

commands:
  dankvotes:
    description: DankVotes admin commands
    usage: /dankvotes <help|reload|status|test|setvotes|addvotes|reset|party|key|version>
    aliases: [dv, dankvote]
  vote:
    description: Show the server's vote links
    usage: /vote
  votes:
    description: Show your (or another player's) vote count and streak
    usage: /votes [player]
    aliases: [myvotes]
  votetop:
    description: Show the top voters leaderboard
    usage: /votetop [page]
    aliases: [topvotes, topvoters]
  voteparty:
    description: Show progress towards the next vote party
    usage: /voteparty
    aliases: [vp]

permissions:
  dankvotes.admin:
    description: Reload, status, test votes, edit vote counts, force parties, show the RSA key
    default: op
  dankvotes.vote:
    description: Use /vote
    default: true
  dankvotes.votes:
    description: Use /votes
    default: true
  dankvotes.votes.others:
    description: Use /votes <player> to view other players
    default: op
  dankvotes.votetop:
    description: Use /votetop
    default: true
  dankvotes.voteparty:
    description: Use /voteparty
    default: true
  dankvotes.reminder.bypass:
    description: Never receive vote reminders
    default: false
  dankvotes.*:
    description: All DankVotes permissions
    default: op
    children:
      dankvotes.admin: true
      dankvotes.vote: true
      dankvotes.votes: true
      dankvotes.votes.others: true
      dankvotes.votetop: true
      dankvotes.voteparty: true
